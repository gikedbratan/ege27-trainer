function hintWire(){const b=document.getElementById('hnow');if(b)b.onclick=()=>{hintShow(HTM.lvl>=1?2:1);if(HTM.lvl>=2)b.remove()};hintStart()}

/* ===== проверка фото решения части 2 (платит ученик, модель посильнее быстрой) ===== */
async function aiGrade(item,files){const ok=await aiInit();if(!ok)throw{code:'not_granted'};
 const n=item.n,cr=CRIT[n].map(([b,t])=>`${b} балл(а): ${t}`).join('\n');
 const prompt=`Ты эксперт ЕГЭ по профильной математике. Проверь решение задания №${n} по критериям ФИПИ 2027. На фото рукописное решение ученика.
Условие: ${strip(item.q)}
Эталонный ответ: ${strip(item.ans||String(item.a))}
Эталонное решение (кратко): ${strip(item.s)}
Критерии:
${cr}
Если на фото не решение этой задачи или текст не читается, поставь 0 и объясни почему.
Ответь только JSON без пояснений вокруг: {"score": целое число от 0 до ${SPEC[n][1]}, "comment": "2-4 предложения по-русски: что верно, где ошибка, чего не хватает для полного балла"}`;
 const r=await AI.s.json(prompt,{images:[...files].slice(0,3),modelTier:'default'});
 const sc=Math.max(0,Math.min(SPEC[n][1],Math.round(+r.score||0)));return{score:sc,comment:String(r.comment||'').slice(0,800)}}

/* ===== варианты целиком ===== */
let EX=null;const EXDUR=235*60;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seeded(seed,fn){const old=Math.random;Math.random=rng(seed);try{return fn()}finally{Math.random=old}}
const EXK={rand:'Случайный вариант',demoA:'Демоверсия 2027, вариант A',demoB:'Демоверсия 2027, вариант B',demoC:'Демоверсия 2027, вариант C'};
function genItem(n,i,seed){const p=seeded(seed,()=>GEN[n][i]());const fig=p.fig||figFor(n,i);
 return{n,q:fixMinus(p.q),a:p.a,ans:null,s:fixMinus(p.s),fig,src:srcLine(n,i)}}
function buildItems(kind,seed){const out=[];
 for(let n=1;n<=20;n++){const sd=seed*31+n*977;
  if(kind==='rand'){const ok=GT[n].map((_,i)=>i).filter(i=>GS[n][i]!=='X');const i=ok[Math.floor(rng(sd)()*ok.length)];out.push(genItem(n,i,sd));continue}
  const k={demoA:0,demoB:1,demoC:2}[kind];const arr=DEMO[n];const d=arr[k]||arr[0];
  if(d.gen){out.push(genItem(d.gen[0],d.gen[1],sd));continue}
  out.push({n,q:d.q,a:d.a!=null?d.a:null,ans:d.ans||null,s:d.s,fig:d.fig||'',src:`Источник: проект демоверсии ФИПИ 2027, задание №${n}${arr.length>1?`, пример ${(arr[k]?k:0)+1} из ${arr.length}`:''} (${A_(LINK.demo,'fipi.ru')}).`})}
 return out}

function exGo(j){exGrab();EX.i=Math.max(0,Math.min(19,j));exSave();exView()}
const exCode=sd=>(sd>>>0).toString(36).toUpperCase();
const exFlags=v=>{const f=[];if(v.away)f.push(`уходил со страницы ${v.away} р.`);if(v.nav)f.push(`выходил из варианта ${v.nav} р.`);if(v.prim>=20&&v.min<60)f.push('20+ первичных быстрее часа');return f.length?` <span class="flag">⚑ ${f.join(', ')}</span>`:''};
function exStart(kind,sd){if(API&&sd==null)return exStartApi(kind);EX={kind,seed:sd!=null?sd>>>0:Math.floor(Math.random()*1e9),t0:Date.now(),ans:{},self:{},ai:{},done:false,vid:'v'+Date.now().toString(36),i:0};EX.items=buildItems(kind,EX.seed);EX.running=true;exSave();exView()}
const exLeft=()=>Math.max(0,EXDUR-(Date.now()-EX.t0)/1000);
let exTimer=null;
function exTick(){const el=document.getElementById('extm');if(!EX||!EX.running||!el){clearInterval(exTimer);exTimer=null;return}

 let j={};try{j=await r.json()}catch(e){}if(!r.ok){if(r.status===401){S.apiTok=null;save()}throw new Error(j.error||('HTTP '+r.status))}return j}

const exFmt=v=>/^-?\d+([.,]\d+)?$/.test(String(v||'').trim().replace(/\s/g,'').replace(/[−–—]/g,'-'));

/* ===== вероятностная модель результата =====
 Точность p_n по номеру n: апостериорное Beta(a0+ok, b0+tot-ok),
 априорно a0 = K*q_n, b0 = K*(1-q_n), q_n = решаемость на ЕГЭ-2025 (ФИПИ), K = 4.
 Баллы за номер: бета-биномиальное предсказательное распределение на 0..m_n.
 Первичный балл: сумма независимых слагаемых, распределение = свёртка. */
const lgam=x=>{const c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
 if(x<.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-lgam(1-x);x-=1;let a=c[0];const t=x+7.5;for(let i=1;i<9;i++)a+=c[i]/(x+i);return .5*Math.log(2*Math.PI)+(x+.5)*Math.log(t)-t+Math.log(a)};
const lBeta=(a,b)=>lgam(a)+lgam(b)-lgam(a+b),lCnk=(m,k)=>lgam(m+1)-lgam(k+1)-lgam(m-k+1);
const bbin=(m,a,b)=>Array.from({length:m+1},(_,k)=>Math.exp(lCnk(m,k)+lBeta(k+a,m-k+b)-lBeta(a,b)));
const KPR=4;
function postAB(n,add){const s=S.st[n]||{ok:0,tot:0};const q=PCT[n]!=null?PCT[n]/100:.5,k=PCT[n]!=null?KPR:2;return[k*q+s.ok+(add||0),k*(1-q)+s.tot-s.ok]}
function scoreDist(tasks,bump){let d=[1];tasks.forEach(n=>{const[a,b]=postAB(n,n===bump?5:0),q=bbin(SPEC[n][1],a,b),r=new Array(d.length+q.length-1).fill(0);
 d.forEach((x,i)=>q.forEach((y,j)=>{r[i+j]+=x*y}));d=r});return d}
const pAtLeast=(d,k)=>d.slice(k).reduce((a,x)=>a+x,0);
const quant=(d,q)=>{let c=0;for(let i=0;i<d.length;i++){c+=d[i];if(c>=q)return i}return d.length-1};
function probCard(c,need,goal){const d=scoreDist(c.tasks),P=pAtLeast(d,need),E=d.reduce((a,x,i)=>a+x*i,0),lo=quant(d,.1),hi=quant(d,.9);
 let lev=c.tasks.map(n=>({n,dp:pAtLeast(scoreDist(c.tasks,n),need)-P})).filter(x=>x.dp>.0005).sort((x,y)=>y.dp-x.dp).slice(0,3),byE=false;
 if(!lev.length){byE=true;lev=c.tasks.map(n=>{const[a,b]=postAB(n),m=SPEC[n][1];return{n,dp:m*((a+5)/(a+b+5)-a/(a+b))}}).sort((x,y)=>y.dp-x.dp).slice(0,3)}
 const W=340,H=90,bw=W/34,mx=Math.max(...d,1e-9);
 const bars=Array.from({length:34},(_,i)=>{const h=(d[i]||0)/mx*(H-16);return `<rect class="hb${i>=need?' g':''}" x="${(i*bw+1).toFixed(1)}" y="${(H-14-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}"/>`}).join('');
 const svg=`<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="Распределение первичного балла">${bars}<line class="hl" x1="${need*bw}" y1="0" x2="${need*bw}" y2="${H-12}"/><text class="ht" x="0" y="${H-2}">0</text><text class="ht" x="${need*bw-4}" y="${H-2}">${need}</text><text class="ht" x="${W-12}" y="${H-2}">33</text></svg>`;
 const pc=x=>x<.001?'меньше 0,1%':String(Math.round(x*1000)/10).replace('.',',')+'%';
 return `<div class="card"><h3 class="ch">Вероятность набрать ${goal}+</h3><p><span class="bigp">${pc(P)}</span></p>${svg}
 <p class="hint">Ожидаемый первичный балл ${String(Math.round(E*10)/10).replace('.',',')}, с вероятностью 80% от ${lo} до ${hi} (${toTest(lo)}-${toTest(hi)} баллов). Зелёные столбцы: исходы от ${need} первичных.</p>
 ${lev.length?`<p><b>Сильнее всего поднимут ${byE?'результат':'вероятность'}</b> (если решишь верно ещё 5 задач номера${byE?'; пока цель далеко, считаем прирост среднего балла':''}):</p><ol class="rl">${lev.map(x=>`<li><button class="lnk" data-go="${x.n}">№${x.n} ${T[x.n].t}</button><span>${byE?`+${String(Math.round(x.dp*100)/100).replace('.',',')} перв. балла в среднем`:`+${pc(x.dp)}`}</span></li>`).join('')}</ol>`:''}
 <details><summary>Как считается</summary><p class="hint">Точность по каждому номеру оценивается формулой Байеса: бета-распределение, где априорная точность равна решаемости задания на ЕГЭ-2025 по данным ФИПИ, а твои решения её уточняют. Баллы за номер имеют бета-биномиальное распределение, распределение суммы находится свёрткой. Совет «что решать» выбирает номер с наибольшим приростом вероятности.</p></details></div>`}

/* ===== модель Раша =====
 P(верно) = σ(θₙ − b), θₙ: уровень ученика по номеру n, b: трудность типа задачи.
 Априорно θₙ = logit(апостериорной точности), b = 1,2·(уровень типа − 2) + 0,4·(сложность номера − 3).
 После ответа y ∈ {0,1}: θₙ += K(y − p), b −= K/2·(y − p), K = max(0,08; 0,6/√(1+k)) (онлайн-оценка, как рейтинг Эло). */
const sig=x=>1/(1+Math.exp(-x)),logit=q=>Math.log(Math.min(.98,Math.max(.02,q))/(1-Math.min(.98,Math.max(.02,q))));
const bPrior=(n,i)=>(GT[n][i][1]-2)*1.2+(D[n]-3)*.4;
const bOf=(n,i)=>{const r=S.irt&&S.irt.b&&S.irt.b[n+'_'+i];return r!=null?r:bPrior(n,i)};
const thN=n=>{const r=S.irt&&S.irt.th&&S.irt.th[n];if(r!=null)return r;const[a,b]=postAB(n);return logit(a/(a+b))};
const chance=(n,i)=>sig(thN(n)-bOf(n,i));
function irtUpd(n,i,y){if(i==null)return;const th=thN(n),b=bOf(n,i);S.irt=S.irt||{};S.irt.th=S.irt.th||{};S.irt.b=S.irt.b||{};S.irt.k=S.irt.k||{};
 const k=S.irt.k[n]||0,K=Math.max(.08,.6/Math.sqrt(1+k)),p=sig(th-b);S.irt.th[n]=th+K*(y-p);S.irt.b[n+'_'+i]=b-K/2*(y-p);S.irt.k[n]=k+1}
/* адаптивный подбор: вес типа exp(−((p − 0,7)/0,15)²), зона «трудно, но решаемо» */
function pickAdaptive(p){const w=p.map(([n,i])=>Math.exp(-(((chance(n,i)-.7)/.15)**2))+.03),s=w.reduce((a,x)=>a+x,0);let r=Math.random()*s;
 for(let j=0;j<p.length;j++){r-=w[j];if(r<=0)return p[j]}return p[p.length-1]}

/* ===== интервальные повторения (кривая забывания Эббингауза) =====
 Удержание R(t) = exp(−t/Sₙ), t и Sₙ в днях. Верно после перерыва ≥ Sₙ/2: Sₙ ← min(60; 2Sₙ), верно без перерыва: ×1,1, ошибка: Sₙ ← max(0,5; Sₙ/2). */
function memUpd(n,ok){S.mem=S.mem||{};const m=S.mem[n]||{s:1,t:0},gap=(Date.now()-m.t)/864e5;
 m.s=ok?Math.min(60,m.s*(m.t&&gap>=m.s/2?2:1.1)):Math.max(.5,m.s/2);m.t=Date.now();S.mem[n]=m}
const retOf=n=>{const m=S.mem&&S.mem[n];return m&&m.t?Math.exp(-(Date.now()-m.t)/864e5/m.s):null};

/* ===== оптимальный план по времени =====
 Ошибка по номеру после k задач: eₙ(k) = eₙ(0)·ρₙᵏ, ρₙ = 1 − 0,1/Dₙ (Dₙ: сложность номера 1-5, трудные учатся медленнее). Ценность очередной задачи mₙ·eₙ(k)·(1 − ρₙ), цена tₙ = 1,5 × норматив ФИПИ.
 Приросты убывают, поэтому жадный выбор по отношению ценность/цена даёт оптимум (дискретная вогнутая задача о рюкзаке). */
const RHO=n=>1-.1/D[n];
function timePlan(tasks,minutes){const st=tasks.map(n=>{const[a,b]=postAB(n);return{n,e:b/(a+b),k:0,t:SPEC[n][0]*1.5,m:SPEC[n][1],r:RHO(n)}});let left=minutes;
 for(let g=0;g<40000;g++){let best=null,br=0;st.forEach(x=>{if(x.t>left)return;const r=x.m*x.e*(1-x.r)/x.t;if(r>br){br=r;best=x}});if(!best||br<1e-7)break;best.e*=best.r;best.k++;left-=best.t}
 return st}
function scoreDistM(tasks,mean){let d=[1];tasks.forEach(n=>{let[a,b]=postAB(n);if(mean[n]!=null){const t=a+b;a=t*mean[n];b=t*(1-mean[n])}
 const q=bbin(SPEC[n][1],Math.max(a,1e-3),Math.max(b,1e-3)),r=new Array(d.length+q.length-1).fill(0);d.forEach((x,i)=>q.forEach((y,j)=>{r[i+j]+=x*y}));d=r});return d}
function timeCard(c,need,goal){const exd=S.exd||'2027-06-01',mpd=S.mpd||60,days=Math.max(0,Math.ceil((Date.parse(exd)-Date.now())/864e5)),tot=Math.round(days*mpd*.8);
 const pl=timePlan(c.tasks,tot).filter(x=>x.k>0).sort((x,y)=>y.k*y.t-x.k*x.t),mean={};pl.forEach(x=>mean[x.n]=1-x.e);
 const d=scoreDistM(c.tasks,mean),P=pAtLeast(d,need),E=d.reduce((a,x,i)=>a+x*i,0),P0=pAtLeast(scoreDist(c.tasks),need);
 const pc=x=>x<.001?'меньше 0,1%':String(Math.round(x*1000)/10).replace('.',',')+'%',h=m=>String(Math.round(m/6)/10).replace('.',',');
 return `<div class="card"><h3 class="ch">План по времени до экзамена</h3><div class="tpl"><label>Дата экзамена<input class="ans" type="date" id="exd" value="${exd}"></label><label>Минут в день<input class="ans" type="number" id="mpd" min="10" max="600" step="10" value="${mpd}"></label></div>
 <p class="hint">Осталось ${days} дн. На задачи ${h(tot)} ч (80% времени, остальное на полные варианты). Дату ЕГЭ 2027 поправь, когда выйдет расписание.</p>
 ${pl.length?`<div class="tscroll"><table class="ttab"><tr><th>Номер</th><th class="r">Задач</th><th class="r">Часов</th><th class="r">Точность</th></tr>${pl.slice(0,10).map(x=>{const[a,b]=postAB(x.n);return `<tr><td>№${x.n} ${T[x.n].t}</td><td class="r">${x.k}</td><td class="r">${h(x.k*x.t)}</td><td class="r">${Math.round(a/(a+b)*100)}% → ${Math.round((1-x.e)*100)}%</td></tr>`}).join('')}</table></div>`:'<p class="hint">Времени не осталось или цель уже достигнута.</p>'}
 <p><b>После плана:</b> вероятность ${goal}+ ${pc(P0)} → <b>${pc(P)}</b>, ожидаемый первичный ${String(Math.round(E*10)/10).replace('.',',')}.</p>
 <details><summary>Как считается</summary><p class="hint">Каждая решённая задача номера уменьшает долю ошибок в ρ раз: ρ = 1 − 0,1/D, где D от 1 до 5 это сложность номера, так что трудные номера учатся медленнее. Время на задачу: норматив ФИПИ × 1,5 с разбором. Время распределяется жадно: следующая задача берётся там, где прирост ожидаемого балла на минуту больше. Для убывающих приростов это оптимальное распределение. Коэффициент 0,1 уточняется по данным класса.</p></details></div>`}

function classCal(list){const R=[],sid={};(list||[]).forEach((r,si)=>(r.log||[]).forEach(e=>{if(e&&e.a&&e.i!=null&&GT[e.n]&&GT[e.n][e.i]){sid[si]=1;R.push([si,e.n+'_'+e.i,e.ok?1:0,e.n,e.i])}}));
 if(R.length<20)return `<div class="card"><h3 class="ch">Трудность задач по классу</h3><p class="hint">Модель Раша включится, когда у класса наберётся 20+ ответов (сейчас ${R.length}).</p></div>`;
 const th={},b={},pr={};R.forEach(([s,k,,n,i])=>{th[s]=0;b[k]=pr[k]=bPrior(n,i)});
 for(let it=0;it<60;it++){const gt={},ht={},gb={},hb={};R.forEach(([s,k,y])=>{const p=sig(th[s]-b[k]);gt[s]=(gt[s]||0)+y-p;ht[s]=(ht[s]||0)+p*(1-p);gb[k]=(gb[k]||0)-(y-p);hb[k]=(hb[k]||0)+p*(1-p)});
  for(const s in th)th[s]+=(gt[s]-.5*th[s])/(ht[s]+.5);for(const k in b)b[k]+=(gb[k]-.5*(b[k]-pr[k]))/(hb[k]+.5)}
 const agg={};R.forEach(([,k,y,n,i])=>{agg[k]=agg[k]||{n,i,c:0,ok:0};agg[k].c++;agg[k].ok+=y});
 const top=Object.entries(agg).filter(([,a])=>a.c>=3).map(([k,a])=>Object.assign({b:b[k]},a)).sort((x,y)=>y.b-x.b).slice(0,10);

 return `<div class="card"><h3 class="ch">Трудность задач по классу</h3><p class="hint">Модель Раша по ${R.length} ответам ${Object.keys(sid).length} учеников: чем больше b, тем труднее тип для класса.</p>
 ${top.length?`<div class="tscroll"><table class="ttab"><tr><th>Тип</th><th class="r">b</th><th class="r">Верно</th></tr>${top.map(x=>`<tr><td>№${x.n} ${escH(GT[x.n][x.i][0])}</td><td class="r">${x.b.toFixed(2).replace('.',',').replace('-','−')}</td><td class="r">${x.ok}/${x.c}</td></tr>`).join('')}</table></div>`:'<p class="hint">Нужно хотя бы 3 ответа на один тип.</p>'}

/* ===== практика: колода типов и история задач =====
 Колода: каждый тип из подборки выпадает один раз за круг (порядок подстраивается под модель Раша),
 история: одна и та же задача (условие, рисунок, ответ) не выдаётся повторно, пока у типа есть новые варианты. */
const phash=p=>{const s=(p.q||'')+'|'+(p.fig||'')+'|'+p.a;let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
let PHC=null,PHS=null;function phSet(){if(!PHC||PHS!==S.ph){S.ph=Array.isArray(S.ph)?S.ph:[];PHC=new Set(S.ph);PHS=S.ph}return PHC}
function phAdd(h){const P_=phSet();if(P_.has(h))return;S.ph.push(h);P_.add(h);if(S.ph.length>6000){S.ph=S.ph.slice(-5000);PHC=null}}
function deckPick(p){const key=cur.mix?`m${S.part}/${S.lvl}/${S.src||''}/${(S.mixNs||[]).join(',')}`:`n${cur.n}/${S.typ[cur.n]??-1}/${S.lvl}/${S.src||''}`;
 S.pdk=S.pdk||{};const all=p.map(([a,b])=>a+'_'+b),ok=new Set(all);let d=(S.pdk[key]||[]).filter(x=>ok.has(x));
 if(!d.length)d=shuffle(all.slice());
 const w=d.map(x=>{if(d.length>1&&x===S.plast)return 0;if(S.lvl!==0||S.src)return 1;const[a,b]=x.split('_').map(Number);return Math.exp(-(((chance(a,b)-.7)/.2)**2))+.15});
 const t=w.reduce((a,x)=>a+x,0);let r=Math.random()*t,j=0;for(;j<d.length-1;j++){r-=w[j];if(r<=0&&w[j]>0)break}if(w[j]===0)j=w.findIndex(x=>x>0);
 const x=d.splice(Math.max(0,j),1)[0];S.pdk[key]=d;S.plast=x;const ks=Object.keys(S.pdk);if(ks.length>80)delete S.pdk[ks[0]];return x.split('_').map(Number)}

/* ===== quiz ===== */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* колода вопросов: каждый вопрос из банка выпадает один раз, пока не пройдены все; генераторы идут по кругу */
function drawStatic(n,k){S.qdeck=S.qdeck||{};let d=S.qdeck[n];if(!Array.isArray(d)||d.some(i=>i>=Q[n].length))d=[];const out=[];
 while(out.length<k&&Q[n].length){if(!d.length){d=shuffle(Q[n].map((_,i)=>i));if(out.length&&d[0]===out[out.length-1])d.push(d.shift())}out.push(d.shift())}
 S.qdeck[n]=d;return out.map(i=>Q[n][i])}
function drawGen(n,k,seen){const g=QG[n]||[];if(!g.length)return[];S.qgpos=S.qgpos||{};let pos=S.qgpos[n]||0;const out=[];
 for(let t=0;t<k*6&&out.length<k;t++){const q=g[pos%g.length]();pos++;if(!seen.has(q[0])){seen.add(q[0]);out.push(q)}}
 S.qgpos[n]=pos%(g.length*997);return out}
function drawTrk(n,k){S.tdeck=S.tdeck||{};const B=TRK[n]||[];let d=S.tdeck[n];if(!Array.isArray(d)||d.some(i=>i>=B.length))d=[];const out=[];
 while(out.length<k&&B.length){if(!d.length)d=shuffle(B.map((_,i)=>i));out.push(d.shift())}S.tdeck[n]=d;return out.map(i=>B[i])}
/* ===== вопросы без повторов =====
 История показанных вопросов хранится по номеру (S.qh). Вопрос не повторяется, пока по номеру не показаны все:
 банк, «с подвохом» и все варианты генераторов. Потом начинается новый круг, и об этом пишется над вопросом.
 Незаконченный набор хранится в S.qs[n] и открывается с того же места. */
const qh=q=>{const s=String(q[0]).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
function qHist(n){S.qh=S.qh||{};if(!Array.isArray(S.qh[n]))S.qh[n]=[];return S.qh[n]}
function drawQs(n,k,mode){const H=new Set(qHist(n)),out=[],inq=new Set((quiz&&quiz.n===n&&Array.isArray(quiz.list)?quiz.list:[]).map(qh));let cyc=false;
 const take=q=>{if(!q||!Array.isArray(q[1])||q[1].length<3)return false;const h=qh(q);if(inq.has(h)||H.has(h))return false;inq.add(h);out.push(q);return true};
 const B=TRK[n]||[],Qn=Q[n]||[],G=QG[n]||[];
 const fill=()=>{const tq=mode==='trk'?k:1;
  for(const q of shuffle(B.slice())){if(out.length>=tq)break;take(q)}
  if(mode==='trk')return;
  let c=0;for(const q of shuffle(Qn.slice())){if(c>=3||out.length>=k)break;if(take(q))c++}
  for(let t=0;t<120&&out.length<k&&G.length;t++)take(G[Math.floor(Math.random()*G.length)]());
  for(const q of shuffle(Qn.slice())){if(out.length>=k)break;take(q)}
  for(const q of shuffle(B.slice())){if(out.length>=k)break;take(q)}};
 fill();
 if(out.length<k&&G.length&&mode!=='trk')for(let t=0;t<3000&&out.length<k;t++)take(G[Math.floor(Math.random()*G.length)]());
 if(out.length<k){cyc=true;
  if(mode==='trk'){const tb=new Set(B.map(qh));S.qh[n]=qHist(n).filter(h=>!tb.has(h))}else S.qh[n]=[];
  H.clear();fill()}
 const hh=qHist(n);out.forEach(q=>hh.push(qh(q)));if(hh.length>1500)S.qh[n]=hh.slice(-1500);
 return{list:shuffle(out),cyc}}
function startQuiz(n,inf,mode){quiz=null;const k=mode==='trk'?Math.min(6,(TRK[n]||[]).length):6;const d=drawQs(n,k,mode);
 quiz={n,list:d.list,i:0,ok:0,inf:!!inf,mode:mode||'',cyc:d.cyc,ord:null,pick:null,fin:false};S.qs=S.qs||{};S.qs[n]=quiz;save();askQ()}
function moreQ(n){const d=drawQs(n,4,quiz.mode);if(d.cyc)quiz.cyc=true;return d.list}
function openQuiz(n){const q=S.qs&&S.qs[n];if(q&&Array.isArray(q.list)&&q.list.length){quiz=q;askQ()}else startQuiz(n)}
function qExtra(){const c=document.querySelector('#pane .card');if(!c||!quiz)return;
 if(quiz.cyc&&quiz.i===0&&!c.querySelector('.qcyc'))c.insertAdjacentHTML('afterbegin','<p class="hint qcyc">Все вопросы по этому номеру уже встречались. Начался новый круг.</p>');
 if(!quiz.inf&&!c.querySelector('#qnew')){c.insertAdjacentHTML('beforeend','<p class="qnew"><button class="lnk" id="qnew">Взять другие вопросы</button></p>');$('#qnew').onclick=()=>startQuiz(quiz.n,false,quiz.mode)}}
function askQ(){if(quiz.inf&&quiz.i>=quiz.list.length-1)quiz.list=quiz.list.concat(moreQ(quiz.n));const{n,list,i}=quiz;
 if(i>=list.length){const best=Math.max(S.qz[n]||0,quiz.ok);S.qz[n]=best;quiz.fin=true;save();
  $('#pane').innerHTML=`<div class="card fade"><div class="score">${quiz.ok} из ${list.length}</div><p>${quiz.ok===list.length?'Теория усвоена, можно решать.':'Стоит перечитать теорию и пройти ещё раз.'} Лучший результат: ${best} из ${list.length}. В следующий раз вопросы будут другими.</p><div class="actions"><button class="btn" id="tp">К практике</button><button class="btn ghost" id="rq">Пройти ещё раз</button><button class="btn ghost" id="qinf">Бесконечный режим</button>${(TRK[n]||[]).length?'<button class="btn ghost" id="qtrk">Только с подвохом</button>':''}<button class="btn ghost" id="rt">Открыть теорию</button></div></div>`;
  $('#tp').onclick=()=>open(n,'practice');$('#rq').onclick=()=>startQuiz(n);$('#qinf').onclick=()=>startQuiz(n,true);const qt=$('#qtrk');if(qt)qt.onclick=()=>startQuiz(n,false,'trk');$('#rt').onclick=()=>open(n,'theory');return}
 const[q,opts,c,e,tag]=list[i];if(!Array.isArray(quiz.ord)||quiz.ord.length!==opts.length){quiz.ord=shuffle(opts.map((o,k)=>k));save()}const ord=quiz.ord;
 $('#pane').innerHTML=`<div class="card fade"><div class="qtop"><span>${quiz.inf?`Вопрос ${i+1}, бесконечный режим`:`Вопрос ${i+1} из ${list.length}`}</span><span>Верно: ${quiz.ok}</span></div>${quiz.inf?'':`<div class="qbar"><i style="width:${i/list.length*100}%"></i></div>`}<p class="qtext" id="qtx">${q}</p><div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${opts[k]}</button>`).join('')}</div><div id="qx"></div></div>`;
 const ans=(k,fresh)=>{const b=document.querySelector(`.opt[data-k="${k}"]`);if(!b)return;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===c)x.classList.add('ok')});
  if(fresh){quiz.pick=k;if(k===c)quiz.ok++;save()}if(k!==c)b.classList.add('bad');
  if(tag==='trk'){const t=$('#qtx');t.classList.add('shown');t.insertAdjacentHTML('beforebegin','<p class="trkb">Это был вопрос с подвохом. Ключевые слова выделены.</p>')}
  $('#qx').innerHTML=`${e?`<p class="expl">${e}</p>`:''}<div class="actions"><button class="btn" id="qn">${quiz.i+1<list.length||quiz.inf?'Дальше':'Результат'}</button>${quiz.inf?'<button class="btn ghost" id="qstop">Закончить</button>':''}</div>`;
  if(quiz.inf)$('#qstop').onclick=()=>{quiz.inf=false;quiz.list=quiz.list.slice(0,quiz.i+1);quiz.i++;quiz.ord=null;quiz.pick=null;save();askQ()};
  $('#qn').onclick=()=>{quiz.i++;quiz.ord=null;quiz.pick=null;save();askQ()};if(fresh)$('#qn').focus({preventScroll:true})};
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(+b.dataset.k,true));if(quiz.pick!=null)ans(quiz.pick,false);qExtra()}

/* ===== practice ===== */
const SRCOPT=()=>[['','Все источники'],['F','Банк ФИПИ / РЕШУ ЕГЭ'],['D','Демоверсия 2027'],['S','Спецификация 2027']].filter(([v])=>!v||Object.values(GS).some(x=>x.includes(v)));
const LVL=[[0,'Все'],[1,'Лёгкие'],[2,'Средние'],[3,'Сложные']];
function segLvl(){return `<div class="seg" id="lvl">${LVL.map(([v,l])=>`<button class="l${v}${S.lvl===v?' on':''}" data-v="${v}">${l}</button>`).join('')}</div>`}
function pool(){const out=[];const ns=cur.mix?Array.from({length:20},(_,i)=>i+1).filter(n=>S.part===0||(S.part===1?n<=13:n>13)):[cur.n];
 (cur.mix&&S.mixNs&&S.mixNs.length?ns.filter(n=>S.mixNs.includes(n)):ns).forEach(n=>{const ty=cur.mix?-1:(S.typ[n]??-1);GT[n].forEach(([,l],i)=>{if(GS[n][i]==='X')return;if(ty>=0&&i!==ty)return;if(ty<0&&S.lvl&&l!==S.lvl)return;if(ty<0&&S.src&&GS[n][i]!==S.src)return;out.push([n,i])})});return out}
function practice(){const n=cur.n;let f;
 if(cur.mix)f=`<div class="lab">Часть</div><div class="seg" id="part">${[[0,'Все'],[1,'Часть 1'],[2,'Часть 2']].map(([v,l])=>`<button class="${S.part===v?'on':''}" data-v="${v}">${l}</button>`).join('')}</div><div class="lab">Уровень</div>${segLvl()}<div class="lab">Источник</div><select class="sel" id="src">${SRCOPT().map(([v,l])=>`<option value="${v}"${S.src===v?' selected':''}>${l}</option>`).join('')}</select><div class="lab">Номера</div><div class="nsel" id="nsel">${Array.from({length:20},(_,k)=>k+1).map(k=>`<button class="${(S.mixNs||[]).includes(k)?'on':''}" data-k="${k}" aria-pressed="${(S.mixNs||[]).includes(k)}">${k}</button>`).join('')}</div>`;
 else{const ty=S.typ[n]??-1;f=`<div class="lab">Уровень</div>${segLvl()}<div class="lab">Тип</div><select class="sel" id="typ"><option value="-1">Все типы (${GT[n].length})</option>${GT[n].map(([nm,l],i)=>GS[n][i]==='X'?'':`<option value="${i}"${ty===i?' selected':''}>${nm}, ${LV[l]}</option>`).join('')}</select><div class="lab">Источник</div><select class="sel" id="src">${SRCOPT().map(([v,l])=>`<option value="${v}"${S.src===v?' selected':''}>${l}</option>`).join('')}</select>`}
 const pl=pool(),tot=cur.mix?0:GT[n].filter((_,i)=>GS[n][i]!=='X').length;
 const LVN=['все уровни','лёгкие','средние','сложные'],fs_=[LVN[S.lvl||0]];if(cur.mix){fs_.unshift(['все номера','часть 1','часть 2'][S.part||0]);if((S.mixNs||[]).length)fs_.push('номера '+S.mixNs.join(', '))}else fs_.push((S.typ[n]??-1)>=0?GT[n][S.typ[n]][0].toLowerCase():'все типы');if(S.src)fs_.push('один источник');
 const fopen=S.fopen!=null?S.fopen:matchMedia('(min-width:861px)').matches;
 $('#pane').innerHTML=`<div class="card"><details class="fbox" id="fbox"${fopen?' open':''}><summary><span>Подборка: <b>${fs_.join(', ')}</b></span></summary><div class="filters">${f}</div></details><p class="tcount">${cur.mix?`Типов в подборке: ${pl.length}. Все идут по кругу, задачи не повторяются.`:`Типов в подборке: ${pl.length} из ${tot}. Все идут по кругу, задачи не повторяются.${pl.length<tot?' <button class="lnk" id="tall">Показать все типы</button>':''}`}</p><div id="pb"></div></div>`;
 {const ta=$('#tall');if(ta)ta.onclick=()=>{S.lvl=0;S.src='';S.typ[n]=-1;save();practice()}}
 $('#fbox').addEventListener('toggle',e=>{S.fopen=e.target.open;save()});
 document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{S.lvl=+b.dataset.v;if(!cur.mix)S.typ[n]=-1;save();practice()});
 $('#src').onchange=e=>{S.src=e.target.value;if(!cur.mix)S.typ[n]=-1;save();practice()};
 if(cur.mix)document.querySelectorAll('#part button').forEach(b=>b.onclick=()=>{S.part=+b.dataset.v;save();practice()});
 if(cur.mix)document.querySelectorAll('#nsel button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,a=new Set(S.mixNs||[]);a.has(k)?a.delete(k):a.add(k);S.mixNs=[...a].sort((x,y)=>x-y);save();practice()});
 else $('#typ').onchange=e=>{S.typ[n]=+e.target.value;if(S.typ[n]>=0)S.lvl=0;save();practice()};
 newProb()}
function newProb(){const p=pool();if(!p.length){$('#pb').innerHTML=`<div class="empty">В этом номере нет заданий с такими фильтрами.<div class="actions" style="justify-content:center"><button class="btn ghost" id="rst">Сбросить фильтры</button></div></div>`;$('#rst').onclick=()=>{S.lvl=0;S.src='';save();practice()};return}
 const[n,i]=deckPick(p);let sd,pr;const PH=phSet();for(let t=0;t<40;t++){sd=Math.floor(Math.random()*4294967295);pr=seeded(sd,()=>GEN[n][i]());if(!PH.has(phash(pr)))break}phAdd(phash(pr));prob=Object.assign({n,i,sd},pr);if(!prob.fig)prob.fig=figFor(n,i);prob.q=fixMinus(prob.q);prob.s=fixMinus(prob.s);checked=false;renderProb()}
function renderProb(){const{n,i}=prob;const[nm,l]=GT[n][i];const st=prog(n);
 $('#pb').innerHTML=`<div class="fade"><div class="ptop"><div class="meta">${cur.mix?`<span class="pill">№${n}</span>`:''}<span class="pill">${nm}</span>${lvPill(l)}<span class="pill" title="Прогноз модели Раша: вероятность решить верно">шанс ${Math.round(chance(n,i)*100)}%</span><span class="pill src${GS[n][i]}" title="${SRC[GS[n][i]][1]}">${SRC[GS[n][i]][0]}</span></div><span class="streak">серия <b>${streak}</b></span></div>
 <div class="ptools"><button class="lnk" id="fav">${isFav()?'★ в сохранённых':'☆ сохранить'}</button><button class="lnk${MK.on?' on':''}" id="mrk" title="Выдели текст условия, чтобы подсветить">маркер</button></div>
 <div class="prob${MK.on?' mk':''}">${prob.q.replace(/<table/g,'<div class="tscroll"><table').replace(/<\/table>/g,'</table></div>')}</div>${prob.fig?`<div class="fig">${prob.fig}</div>`:''}
 <div class="ansrow"><input class="ans" id="ans" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="Ответ" aria-label="Ответ"><button class="btn" id="chk">Проверить</button><button class="btn ghost" id="shw">Решение</button></div>
 <p class="hint">Дробь пиши через запятую: 0,25.${cur.mix?'':` Верно в этом номере: ${st.ok} из ${st.tot}.`}</p>${hintBar()}<div id="res"></div><details class="srcd"><summary>Откуда эта задача</summary><p class="src">${srcLine(n,i)}</p></details></div>`;
 const inp=$('#ans');if(matchMedia('(min-width:861px)').matches)inp.focus({preventScroll:true});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checked?newProb():check()}});
 $('#chk').onclick=check;$('#shw').onclick=()=>reveal(false,false);hintWire();toolsWire()}
function parse(v){v=v.trim().replace(/\s/g,'').replace(/[−–—]/g,'-').replace(',','.');if(/^-?\d+\/\d+$/.test(v)){const[a,b]=v.split('/');return +a/ +b}return v===''?NaN:Number(v)}
function check(){if(checked)return;const v=parse($('#ans').value);if(isNaN(v)){$('#res').innerHTML=`<div class="fb bad">Введите число, например 12, −3 или 0,75.</div>`;return}
 reveal(Math.abs(v-prob.a)<1e-6+1e-9*Math.abs(prob.a),true);
 if(/\//.test($('#ans').value))$('#res').insertAdjacentHTML('afterbegin','<div class="fb bad">На ЕГЭ ответ пишут целым числом или десятичной дробью. Обыкновенную дробь бланк не примет, в варианте она не засчитается.</div>')}
function reveal(ok,answered){hintStop();checked=true;const hb=document.getElementById('hbar');if(hb)hb.remove();const n=prob.n;S.st[n]=S.st[n]||{ok:0,tot:0};S.st[n].tot++;if(ok){S.st[n].ok++;streak++}else streak=0;irtUpd(n,prob.i,ok?1:0);memUpd(n,ok);errUpd(ok);if(answered)dayUpd();if(ok)hwUpd(n);S.log=(S.log||[]).concat([{n,i:prob.i,ok:ok?1:0,a:answered?1:0,t:Date.now()}]).slice(-30);save();side();
 const A=String(Math.round(prob.a*1e9)/1e9).replace('.',',').replace('-','−');
 $('#chk').disabled=true;$('#shw').disabled=true;$('#ans').readOnly=true;
 $('#res').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${answered?(ok?'Верно':`Неверно. Ответ: ${A}`):`Ответ: ${A}`}</div><div class="sol"><span class="t">Решение</span>${prob.s}</div>
 <div class="actions"><button class="btn" id="nx">Следующее задание</button><button class="btn ghost" id="th">Теория к №${n}</button></div>`;
 document.querySelector('.streak b').textContent=streak;
 $('#nx').onclick=()=>{newProb();$('#pb').scrollIntoView({block:'start',behavior:'smooth'})};$('#th').onclick=()=>open(n,'theory');
 if(prob.rep){const nx=(S.err||[]).find(x=>x.k!==prob.rep);const b=$('#nx');if(nx){b.textContent='Следующая ошибка';b.onclick=()=>replay(nx)}else{b.textContent='Ошибки закончились';b.onclick=myView}}
 $('#res').scrollIntoView({block:'nearest',behavior:'smooth'})}
function openMix(){hintStop();cur={n:null,tab:'practice',mix:true};RS_.on=false;S.now={mix:1};save();side();streak=0;ttl('<span>∞</span>Смешанная практика');
 $('#view').innerHTML=`<div class="head"><div class="big" aria-hidden="true">∞</div><div><h1>Смешанная практика</h1><div class="meta"><span class="pill">задания с 1 по 20 вперемешку</span></div></div></div><div id="pane"></div>`;
 practice();toTop('openMix')}

$('#fab').onclick=()=>chatToggle(!AI.open);
boot();
